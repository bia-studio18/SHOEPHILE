<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your SHOEPHILE account.">
  <title>Sign In — SHOEPHILE</title>
  <link rel="icon" href="/images/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="mobile-menu-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
      <a href="index.html" class="logo" aria-label="SHOEPHILE Home">
        <img src="Shoephile_logo.svg" class="shoephile-logo" alt="SHOEPHILE — Love Affair with Shoes">
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <button class="header-action" data-search-open aria-label="Search">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button class="theme-toggle" aria-label="Toggle theme"></button>
        <a href="cart.html" class="header-action" aria-label="Shopping bag">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="mobile-overlay"></div>
  <nav class="mobile-nav">
    <button class="mobile-nav-close" aria-label="Close menu">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="mobile-nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="search-overlay">
    <form class="search-form">
      <div class="search-input-wrap">
        <input type="search" class="search-input" placeholder="Search flats..." aria-label="Search">
        <button type="button" class="search-close" aria-label="Close search">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </form>
  </div>

  <main class="auth-page">
    <div class="auth-card">
      <!-- LOGIN VIEW -->
      <div id="login-view">
        <p class="section-label">Account</p>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your SHOEPHILE account</p>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" name="email" autocomplete="email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="password-wrap">
              <input type="password" id="login-password" name="password" autocomplete="current-password" required minlength="8" placeholder="Your password">
              <button type="button" class="password-toggle" data-password-toggle="login-password" aria-label="Show password">
                <svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="auth-links-row">
            <button type="button" class="btn-ghost" id="show-forgot">Forgot Password?</button>
          </div>
          <p class="auth-error" id="login-error" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
        </form>

        <p class="auth-switch">
          Don't have an account?
          <a href="signup.html">Create Account</a>
        </p>
      </div>

      <!-- FORGOT PASSWORD VIEW -->
      <div id="forgot-view" hidden>
        <p class="section-label">Account</p>
        <h1 class="auth-title">Reset Your Password</h1>
        <p class="auth-subtitle">Enter your email address and we'll send you a password reset link.</p>

        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label for="forgot-email">Email Address</label>
            <input type="email" id="forgot-email" name="email" autocomplete="email" required placeholder="you@example.com">
          </div>
          <p class="auth-error" id="forgot-error" role="alert" hidden></p>
          <p class="auth-success" id="forgot-success" role="status" hidden></p>
          <button type="submit" class="btn btn-primary btn-full" id="forgot-btn">Send Reset Link</button>
        </form>

        <p class="auth-switch">
          <button type="button" class="btn-ghost" id="back-to-login">Back to Sign In</button>
        </p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding-top:0;">
        <p>&copy; 2026 SHOEPHILE. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.init();
      bindPasswordToggles();

      const loginView = document.getElementById('login-view');
      const forgotView = document.getElementById('forgot-view');

      document.getElementById('show-forgot')?.addEventListener('click', () => {
        loginView.hidden = true;
        forgotView.hidden = false;
      });
      document.getElementById('back-to-login')?.addEventListener('click', () => {
        forgotView.hidden = true;
        loginView.hidden = false;
      });

      // Login
      document.getElementById('login-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const errEl = document.getElementById('login-error');
        const btn = document.getElementById('login-btn');

        errEl.hidden = true;
        errEl.textContent = '';

        if (!email || !password) {
          errEl.textContent = 'Please enter email and password.';
          errEl.hidden = false;
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Signing In...';

        try {
          await Auth.loginUser(email, password);
          Auth.updateNavbar();
          if (typeof Cart !== 'undefined') Cart.showToast('Welcome back');

          const params = new URLSearchParams(window.location.search);
          const returnUrl = params.get('return');
          if (returnUrl && returnUrl.startsWith('/') === false && !returnUrl.includes('://')) {
            // relative path only
            window.location.href = decodeURIComponent(returnUrl);
          } else if (document.referrer && document.referrer.includes('checkout')) {
            window.location.href = 'checkout.html';
          } else {
            window.location.href = 'index.html';
          }
        } catch (err) {
          errEl.textContent = err.message || 'Invalid email or password.';
          errEl.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });

      // Forgot password
      document.getElementById('forgot-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value.trim();
        const errEl = document.getElementById('forgot-error');
        const successEl = document.getElementById('forgot-success');
        const btn = document.getElementById('forgot-btn');

        errEl.hidden = true;
        successEl.hidden = true;

        if (!email) {
          errEl.textContent = 'Please enter your email address.';
          errEl.hidden = false;
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Sending...';

        try {
          const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json().catch(() => ({}));
          // Always show generic success message
          successEl.textContent = data.message || 'If an account exists for this email, a password reset link has been sent.';
          successEl.hidden = false;
        } catch {
          successEl.textContent = 'If an account exists for this email, a password reset link has been sent.';
          successEl.hidden = false;
        } finally {
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
        }
      });
    });
  </script>
</body>
</html>
