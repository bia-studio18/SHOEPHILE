<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your SHOEPHILE account.">
  <title>Create Account — SHOEPHILE</title>
  <link rel="icon" href="/images/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="mobile-menu-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
      <a href="index.html" class="logo" aria-label="SHOEPHILE Home">
        <img src="Shoephile_logo.svg" class="shoephile-logo" alt="SHOEPHILE — Love Affair with Shoes">
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <button class="header-action" data-search-open aria-label="Search">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button class="theme-toggle" aria-label="Toggle theme"></button>
        <a href="cart.html" class="header-action" aria-label="Shopping bag">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="mobile-overlay"></div>
  <nav class="mobile-nav">
    <button class="mobile-nav-close" aria-label="Close menu">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="mobile-nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="search-overlay">
    <form class="search-form">
      <div class="search-input-wrap">
        <input type="search" class="search-input" placeholder="Search flats..." aria-label="Search">
        <button type="button" class="search-close" aria-label="Close search">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </form>
  </div>

  <main class="auth-page">
    <div class="auth-card">
      <p class="section-label">Account</p>
      <h1 class="auth-title">Create Your Account</h1>
      <p class="auth-subtitle">Join the SHOEPHILE circle</p>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" name="name" autocomplete="name" required placeholder="Your full name">
        </div>
        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" name="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="signup-phone">Phone Number</label>
          <input type="tel" id="signup-phone" name="phone" autocomplete="tel" placeholder="+92 3XXXXXXXXX">
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="signup-password" name="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
            <button type="button" class="password-toggle" data-password-toggle="signup-password" aria-label="Show password">
              <svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="password-strength" id="password-strength" data-score="0"></div>
        </div>
        <div class="form-group">
          <label for="signup-confirm">Confirm Password</label>
          <div class="password-wrap">
            <input type="password" id="signup-confirm" name="confirmPassword" autocomplete="new-password" required minlength="8" placeholder="Confirm your password">
            <button type="button" class="password-toggle" data-password-toggle="signup-confirm" aria-label="Show password">
              <svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <p class="auth-error" id="signup-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-full" id="signup-btn">Create Account</button>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="login.html">Sign In</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding-top:0;">
        <p>&copy; 2026 SHOEPHILE. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.init();
      bindPasswordToggles();
      bindPasswordStrength('signup-password', 'password-strength');

      document.getElementById('signup-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const phone = document.getElementById('signup-phone').value.trim();
        const password = document.getElementById('signup-password').value;
        const confirmPassword = document.getElementById('signup-confirm').value;
        const errEl = document.getElementById('signup-error');
        const btn = document.getElementById('signup-btn');

        errEl.hidden = true;
        errEl.textContent = '';

        if (!name || !email || !password) {
          errEl.textContent = 'Please fill in all required fields.';
          errEl.hidden = false;
          return;
        }
        if (password.length < 8) {
          errEl.textContent = 'Password must be at least 8 characters.';
          errEl.hidden = false;
          return;
        }
        if (password !== confirmPassword) {
          errEl.textContent = 'Passwords do not match.';
          errEl.hidden = false;
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating Account...';

        try {
          await Auth.signupUser({ name, email, phone, password, confirmPassword });
          Auth.updateNavbar();
          if (typeof Cart !== 'undefined') Cart.showToast('Account created — welcome to SHOEPHILE');
          window.location.href = 'index.html';
        } catch (err) {
          const msg = (err.message || '').toLowerCase();
          if (msg.includes('already') || msg.includes('exists') || msg.includes('duplicate')) {
            errEl.textContent = 'An account with this email already exists.';
          } else if (msg.includes('invalid') && msg.includes('email')) {
            errEl.textContent = 'Please enter a valid email address.';
          } else if (msg.includes('weak') || msg.includes('short')) {
            errEl.textContent = 'Password is too weak. Use at least 8 characters.';
          } else if (msg.includes('match')) {
            errEl.textContent = 'Passwords do not match.';
          } else {
            errEl.textContent = err.message || 'Something went wrong. Please try again.';
          }
          errEl.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>
