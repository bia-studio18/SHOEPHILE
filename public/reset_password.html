<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your SHOEPHILE password.">
  <title>Reset Password — SHOEPHILE</title>
  <link rel="icon" href="/images/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="mobile-menu-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
      <a href="index.html" class="logo" aria-label="SHOEPHILE Home">
        <img src="Shoephile_logo.svg" class="shoephile-logo" alt="SHOEPHILE — Love Affair with Shoes">
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" aria-label="Toggle theme"></button>
        <a href="cart.html" class="header-action" aria-label="Shopping bag">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="mobile-overlay"></div>
  <nav class="mobile-nav">
    <button class="mobile-nav-close" aria-label="Close menu">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="mobile-nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <div id="reset-form-view">
        <p class="section-label">Account</p>
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle">Choose a strong password for your account.</p>

        <form id="reset-form" novalidate>
          <div class="form-group">
            <label for="reset-password">New Password</label>
            <div class="password-wrap">
              <input type="password" id="reset-password" name="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
              <button type="button" class="password-toggle" data-password-toggle="reset-password" aria-label="Show password">
                <svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="reset-confirm">Confirm New Password</label>
            <div class="password-wrap">
              <input type="password" id="reset-confirm" name="confirmPassword" autocomplete="new-password" required minlength="8" placeholder="Confirm new password">
              <button type="button" class="password-toggle" data-password-toggle="reset-confirm" aria-label="Show password">
                <svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <p class="auth-error" id="reset-error" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary btn-full" id="reset-btn">Update Password</button>
        </form>
      </div>

      <div id="reset-success-view" hidden>
        <p class="section-label">Account</p>
        <h1 class="auth-title">Password Updated</h1>
        <p class="auth-subtitle">Your password has been updated successfully.</p>
        <a href="login.html" class="btn btn-primary btn-full">Sign In</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding-top:0;">
        <p>&copy; 2026 SHOEPHILE. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.init();
      bindPasswordToggles();

      const token = new URLSearchParams(window.location.search).get('token');
      const errEl = document.getElementById('reset-error');

      if (!token) {
        errEl.textContent = 'Invalid or missing reset link. Please request a new one.';
        errEl.hidden = false;
        document.getElementById('reset-btn').disabled = true;
      }

      document.getElementById('reset-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = document.getElementById('reset-password').value;
        const confirmPassword = document.getElementById('reset-confirm').value;
        const btn = document.getElementById('reset-btn');

        errEl.hidden = true;
        errEl.textContent = '';

        if (password.length < 8) {
          errEl.textContent = 'Password must be at least 8 characters.';
          errEl.hidden = false;
          return;
        }
        if (password !== confirmPassword) {
          errEl.textContent = 'Passwords do not match.';
          errEl.hidden = false;
          return;
        }
        if (!token) {
          errEl.textContent = 'Invalid or expired reset link.';
          errEl.hidden = false;
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Updating Password...';

        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password, confirmPassword })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            throw new Error(data.message || data.error || 'Could not reset password.');
          }
          document.getElementById('reset-form-view').hidden = true;
          document.getElementById('reset-success-view').hidden = false;
        } catch (err) {
          const msg = (err.message || '').toLowerCase();
          if (msg.includes('expired')) {
            errEl.textContent = 'This reset link has expired. Please request a new one.';
          } else if (msg.includes('invalid') || msg.includes('token')) {
            errEl.textContent = 'Invalid or expired reset link.';
          } else if (msg.includes('match')) {
            errEl.textContent = 'Passwords do not match.';
          } else if (msg.includes('short') || msg.includes('weak')) {
            errEl.textContent = 'Password is too short. Use at least 8 characters.';
          } else {
            errEl.textContent = err.message || 'Something went wrong. Please try again.';
          }
          errEl.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Update Password';
        }
      });
    });
  </script>
</body>
</html>
