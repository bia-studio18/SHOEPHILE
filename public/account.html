<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your SHOEPHILE account and orders.">
  <title>My Account — SHOEPHILE</title>
  <link rel="icon" href="/images/logo.jpg" type="image/jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="mobile-menu-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
      <a href="index.html" class="logo" aria-label="SHOEPHILE Home">
        <img src="Shoephile_logo.svg" class="shoephile-logo" alt="SHOEPHILE — Love Affair with Shoes">
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <button class="header-action" data-search-open aria-label="Search">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button class="theme-toggle" aria-label="Toggle theme"></button>
        <a href="cart.html" class="header-action" aria-label="Shopping bag">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="mobile-overlay"></div>
  <nav class="mobile-nav">
    <button class="mobile-nav-close" aria-label="Close menu">
      <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="mobile-nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="search-overlay">
    <form class="search-form">
      <div class="search-input-wrap">
        <input type="search" class="search-input" placeholder="Search flats..." aria-label="Search">
        <button type="button" class="search-close" aria-label="Close search">
          <svg class="icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </form>
  </div>

  <div class="page-header">
    <div class="container">
      <nav class="breadcrumb"><a href="index.html">Home</a> / My Account</nav>
      <h1>My Account</h1>
    </div>
  </div>

  <section class="section">
    <div class="container account-layout">
      <div class="account-card">
        <h2 class="account-section-title">Profile</h2>
        <div id="account-profile">
          <p class="text-muted">Loading...</p>
        </div>
        <button type="button" class="btn btn-outline btn-sm" id="account-logout" style="margin-top:1.25rem;">Logout</button>
      </div>

      <div class="account-card" id="orders">
        <h2 class="account-section-title">My Orders</h2>
        <div id="account-orders">
          <p class="text-muted">Loading orders...</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding-top:0;">
        <p>&copy; 2026 SHOEPHILE. All rights reserved.</p>
      </div>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await Auth.init();

      const ok = await Auth.requireLogin();
      if (!ok) return;

      const user = Auth.getCurrentUser();
      const profileEl = document.getElementById('account-profile');
      if (user && profileEl) {
        profileEl.innerHTML = `
          <p><strong>Name</strong><br>${user.name || '—'}</p>
          <p style="margin-top:0.75rem;"><strong>Email</strong><br>${user.email || '—'}</p>
          <p style="margin-top:0.75rem;"><strong>Phone</strong><br>${user.phone || '—'}</p>
        `;
      }

      document.getElementById('account-logout')?.addEventListener('click', async () => {
        await Auth.logoutUser();
        if (typeof Cart !== 'undefined') Cart.showToast('You have been logged out');
        window.location.href = 'index.html';
      });

      // Load orders
      const ordersEl = document.getElementById('account-orders');
      try {
        const token = Auth.getAuthToken();
        const res = await fetch('/api/my-orders', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Could not load orders');
        const data = await res.json();
        const orders = Array.isArray(data) ? data : (data.orders || []);

        if (!orders.length) {
          ordersEl.innerHTML = `
            <p class="text-muted">You have no orders yet.</p>
            <a href="shop.html" class="btn btn-outline btn-sm" style="margin-top:1rem;">Shop Collection</a>`;
          return;
        }

        ordersEl.innerHTML = orders.map(o => {
          const num = o.orderNumber || o.id || '—';
          const date = o.createdAtLocal || (o.createdAt ? new Date(o.createdAt).toLocaleDateString() : '—');
          const status = o.status || 'Processing';
          const total = o.total != null ? `PKR ${Number(o.total).toLocaleString()}` : '—';
          const items = (o.items || []).map(i => `${i.name || i.productName || 'Item'} × ${i.qty || 1}`).join(', ') || '—';
          return `
            <div class="order-row">
              <div class="order-row-main">
                <div>
                  <strong>Order ${num}</strong>
                  <span class="order-meta">${date} · ${status}</span>
                </div>
                <div class="order-total">${total}</div>
              </div>
              <p class="order-items text-muted">${items}</p>
              <a href="track.html?id=${encodeURIComponent(num)}" class="btn btn-ghost btn-sm">Track Order</a>
            </div>`;
        }).join('');
      } catch {
        ordersEl.innerHTML = `<p class="text-muted">Unable to load orders. Please try again later.</p>`;
      }
    });
  </script>
</body>
</html>
