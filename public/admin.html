        <!-- ABOUT PAGE CONTENT -->
        <div class="admin-panel" id="panel-about-content">
          <div class="admin-form-card" style="max-width:800px;">
            <h2>About Page Content</h2>
            <p class="text-muted" style="font-size:0.85rem;margin-bottom:1.25rem;">Manage craftsmanship section and main image.</p>
            <form id="about-content-form" class="admin-form">
              <div class="form-group">
                <label>Main</label>
                <input type="file" id="about-hero-file" accept="image/*">
                <div id="about-hero-preview" style="margin-top:0.75rem;"></div>
              </div>
              <h3 style="margin:1.5rem 0 0.75rem;font-size:1rem;">Craftsmanship section</h3>
              <div class="form-group">
                <label>Label / eyebrow</label>
                <input type="text" id="about-craft-label">
              </div>
              <div class="form-group">
                <label>Heading</label>
                <input type="text" id="about-craft-heading">
              </div>
              <div class="form-group">
                <label>First paragraph</label>
                <textarea id="about-craft-para1" rows="3"></textarea>
              </div>
              <div class="form-group">
                <label>Second paragraph</label>
                <textarea id="about-craft-para2" rows="3"></textarea>
              </div>

              <div style="display:flex;gap:0.75rem;margin-top:1.25rem;">
                <button type="submit" class="btn btn-primary" style="flex:1;">Save Changes</button>
                <button type="button" class="btn btn-outline" id="about-content-reload">Reload</button>
              </div>
              <p id="about-content-msg" style="font-size:0.85rem;margin-top:0.75rem;"></p>
            </form>
          </div>
        </div>

  <script>
        /* ---------- About Page CMS ---------- */
    let aboutHeroFile = null;

    async function loadAboutContentForm() {
      try {
        const res = await fetch('/api/content/about');
        const c = await res.json();
        document.getElementById('about-craft-label').value = c.craftLabel || '';
        document.getElementById('about-craft-heading').value = c.craftHeading || '';
        document.getElementById('about-craft-para1').value = c.craftPara1 || '';
        document.getElementById('about-craft-para2').value = c.craftPara2 || '';
        const prev = document.getElementById('about-hero-preview');
        if (prev) {
          prev.innerHTML = c.heroImage
            ? `<img src="${c.heroImage}" alt="About preview" style="max-width:100%;max-height:200px;object-fit:cover;border:1px solid var(--border);">`
            : '<span class="text-muted" style="font-size:0.8rem;">No custom image</span>';
        }
        aboutHeroFile = null;
        document.getElementById('about-hero-file').value = '';
        document.getElementById('about-content-msg').textContent = '';
      } catch (e) {
        document.getElementById('about-content-msg').textContent = 'Could not load about content.';
      }
    }

    document.getElementById('about-hero-file')?.addEventListener('change', (e) => {
      const f = e.target.files[0];
      aboutHeroFile = f || null;
      const prev = document.getElementById('about-hero-preview');
      if (f && prev) {
        prev.innerHTML = `<img src="${URL.createObjectURL(f)}" alt="Preview" style="max-width:100%;max-height:200px;object-fit:cover;border:1px solid var(--border);">`;
      }
    });

    document.getElementById('about-content-reload')?.addEventListener('click', loadAboutContentForm);

    document.getElementById('about-content-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('about-content-msg');
      const fd = new FormData();
      fd.append('craftLabel', document.getElementById('about-craft-label').value);
      fd.append('craftHeading', document.getElementById('about-craft-heading').value);
      fd.append('craftPara1', document.getElementById('about-craft-para1').value);
      fd.append('craftPara2', document.getElementById('about-craft-para2').value);
      if (aboutHeroFile) fd.append('heroImage', aboutHeroFile);
      try {
        const res = await fetch('/api/content/about', {
          method: 'PUT',
          headers: { 'x-admin-key': adminPassword },
          body: fd,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Save failed');
        msg.style.color = 'var(--success)';
        msg.textContent = 'About page content saved. Refresh the About page to see changes.';
        aboutHeroFile = null;
        loadAboutContentForm();
      } catch (err) {
        msg.style.color = 'var(--error)';
        msg.textContent = err.message || 'Could not save.';
      }
    });
  </script>
</body>
</html>
